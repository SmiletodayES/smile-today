<!doctype html>
<html lang="en">
<head>

<title>Thank you! — Smile Supply Co.</title>
<link rel="icon" type="image/png" sizes="32x32" href="images/favicon-32.png" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">

<body>
  <header class="site-header">
    <div class="logo">
      <svg class="smiley" viewBox="0 0 100 60" width="46" height="28" aria-hidden="true">
        <g fill="none" stroke="#17140F" stroke-width="7" stroke-linecap="round">
          <rect x="30" y="4" width="10" height="12" rx="4" fill="#17140F" stroke="none"/>
          <rect x="60" y="4" width="10" height="12" rx="4" fill="#17140F" stroke="none"/>
          <path d="M22,28 Q50,54 78,28" />

      </svg>

  <section class="hero">
    <h1>you're all set</h1>

    <a href="/index.html" class="btn btn-primary">Back to the shop</a>

  <footer class="site-footer">
    <p>&copy; <span id="year"></span> Smile Supply Co.</p>
